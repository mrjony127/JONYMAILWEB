<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JONY MAIL</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
:root{
  --bg:#080d0b;--panel:#101914;--panel2:#17231c;
  --green:#19d477;--text:#f0fff5;--muted:#91a99a;
  --border:#26392d;--red:#ff5555;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#authPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:390px;background:var(--panel);padding:28px;border:1px solid var(--border);border-radius:20px}
.logo{font-size:29px;font-weight:900;color:var(--green)}
.logo span{color:white}
.subtitle{color:var(--muted);font-size:13px;margin:9px 0 25px}
.field{width:100%;padding:14px;background:#080f0b;border:1px solid var(--border);border-radius:10px;color:white;margin:7px 0;outline:none}
.field:focus{border-color:var(--green)}
.btn{border:0;border-radius:10px;padding:13px 16px;background:var(--green);color:#06150c;font-weight:bold;width:100%;margin-top:10px}
.btn.secondary{background:var(--panel2);color:white;border:1px solid var(--border)}
.auth-switch{color:var(--green);cursor:pointer;text-align:center;margin-top:17px;font-size:13px}
#app{min-height:100vh}
.topbar{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.topbar .logo{font-size:23px}
.top-actions{display:flex;gap:8px;align-items:center}
.small-btn{background:var(--panel2);border:1px solid var(--border);color:white;padding:9px 12px;border-radius:9px}
.layout{display:flex;min-height:calc(100vh - 65px)}
.sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);padding:15px;flex-shrink:0}
.account-title{font-size:11px;color:var(--muted);margin:17px 8px 8px;text-transform:uppercase;letter-spacing:1px}
.nav{display:flex;align-items:center;gap:12px;padding:11px;border-radius:9px;color:#c7d9cd;cursor:pointer;font-size:14px;margin:3px 0}
.nav:hover,.nav.active{background:#173526;color:var(--green)}
.account-item{padding:10px;border-radius:9px;cursor:pointer;color:#c7d9cd;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-item:hover,.account-item.active{background:#173526;color:var(--green)}
.main{flex:1;min-width:0;padding:18px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.heading h2{font-size:21px;margin:0}
.search{width:100%;max-width:420px;padding:12px 15px;background:var(--panel);border:1px solid var(--border);color:white;border-radius:10px;outline:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}
.toolbar button{background:var(--panel);border:1px solid var(--border);color:white;padding:9px 13px;border-radius:9px}
.toolbar button:hover{border-color:var(--green)}
.status{color:var(--muted);font-size:12px;margin:10px 0}
.message-list{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.message{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;min-width:0}
.message:last-child{border-bottom:0}
.message:hover{background:#17251c}
.message.unread .sender,.message.unread .subject{font-weight:bold;color:white}
.sender{width:190px;flex-shrink:0;font-size:13px;color:#c4d6ca;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message-content{flex:1;min-width:0}
.subject{font-size:13px;color:#e3eee7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snippet{color:var(--muted);font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{font-size:11px;color:var(--muted);white-space:nowrap}
.source{color:var(--green);font-size:10px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:45px 15px;text-align:center;color:var(--muted);font-size:14px}
#reader{position:fixed;inset:0;background:#080d0b;z-index:20;display:none;overflow:auto;padding:20px}
.reader-box{max-width:850px;margin:20px auto;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:20px}
.reader-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.reader-meta{color:var(--muted);font-size:13px;line-height:1.8;margin:15px 0;white-space:pre-wrap}
.reader-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:14px}
.otp-box{margin:15px 0;padding:14px;background:#173526;border:1px solid var(--green);border-radius:10px}
.otp-code{font-size:25px;font-weight:bold;letter-spacing:4px;color:var(--green);margin:8px 0}
.copy-btn{background:var(--green);border:0;border-radius:8px;padding:9px 15px;font-weight:bold;color:#06150c}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173526;color:white;padding:12px 18px;border-radius:10px;z-index:50;display:none;font-size:13px;max-width:90%;text-align:center}
.mobile-menu{display:none}
@media(max-width:720px){
.sidebar{position:fixed;left:-280px;top:65px;bottom:0;z-index:10;transition:.2s;overflow:auto;box-shadow:10px 0 30px #0008}
.sidebar.open{left:0}
.mobile-menu{display:block}
.main{padding:13px}
.sender{width:105px}
.date{font-size:10px}
.message{gap:8px;padding:12px 9px}
}
</style>
</head>
<body>

<section id="authPage">
 <div class="auth-card">
  <div class="logo">JONY<span> MAIL</span></div>
  <div class="subtitle">Your Gmail accounts. One dashboard.</div>
  <div id="loginForm">
   <input id="loginEmail" class="field" type="email" placeholder="JONY MAIL Email">
   <input id="loginPassword" class="field" type="password" placeholder="Password">
   <button class="btn" onclick="login()">LOGIN</button>
   <button class="btn secondary" onclick="googleLogin()">Continue with Google</button>
   <div class="auth-switch" onclick="showSignup()">Create a new JONY MAIL account</div>
  </div>
  <div id="signupForm" class="hidden">
   <input id="signupEmail" class="field" type="email" placeholder="Your Email">
   <input id="signupPassword" class="field" type="password" placeholder="Create Password">
   <button class="btn" onclick="signup()">CREATE ACCOUNT</button>
   <div class="auth-switch" onclick="showLogin()">Already have an account? Login</div>
  </div>
  <div id="authStatus" class="status"></div>
 </div>
</section>

<section id="app" class="hidden">
 <header class="topbar">
  <div class="top-actions">
   <button class="small-btn mobile-menu" onclick="toggleSidebar()">☰</button>
   <div class="logo">JONY<span> MAIL</span></div>
  </div>
  <div class="top-actions">
   <button class="small-btn" onclick="reloadEverything()">↻ Refresh</button>
   <button class="small-btn" onclick="logout()">Logout</button>
  </div>
 </header>
 <div class="layout">
  <aside class="sidebar" id="sidebar">
   <button class="btn" onclick="connectGmail()">＋ Connect Gmail</button>
   <div class="account-title">Mailbox</div>
   <div id="systemFolders"></div>
   <div class="account-title">Connected Gmail</div>
   <div class="nav active" id="allAccountsNav" onclick="selectAllAccounts()">✉ All Accounts</div>
   <div id="accountList"></div>
  </aside>
  <main class="main">
   <div class="heading">
    <h2 id="pageTitle">All Inbox</h2>
    <span class="status" id="accountCount">0 Gmail accounts</span>
   </div>
   <input class="search" id="searchBox" placeholder="Search messages, sender, subject..." oninput="renderMessages()">
   <div class="toolbar">
    <button onclick="reloadMessages()">↻ Refresh Messages</button>
    <button onclick="connectGmail()">＋ Add Gmail</button>
   </div>
   <div class="status" id="loadStatus">Loading...</div>
   <div class="message-list" id="messageList"><div class="empty">Loading messages...</div></div>
  </main>
 </div>
</section>

<div id="reader">
 <div class="reader-box">
  <div class="reader-head">
   <strong style="color:var(--green)">JONY MAIL</strong>
   <button class="small-btn" onclick="closeReader()">✕ Close</button>
  </div>
  <h2 id="readSubject">Loading...</h2>
  <div class="reader-meta" id="readMeta"></div>
  <div id="otpArea"></div>
  <hr style="border-color:var(--border)">
  <div class="reader-body" id="readBody"></div>
 </div>
</div>
<div id="toast"></div>

<script>
const firebaseConfig={
 apiKey:"AIzaSyCnd_LT7H3o5HHbTFAZAHo6e2donTrN6sM",
 authDomain:"jony-mail-hub-2466c.firebaseapp.com",
 projectId:"jony-mail-hub-2466c",
 storageBucket:"jony-mail-hub-2466c.firebasestorage.app",
 messagingSenderId:"370585861930",
 appId:"1:370585861930:web:e70dc809dd7c91046e2853",
 measurementId:"G-2NMMQWBNQE"
};

const API_BASE="https://jony-mail-backend-2026.onrender.com";
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

let currentUser=null;
let accounts=[];
let messages=[];
let selectedAccount="all";
let selectedFolder="INBOX";
let customLabels=[];
let loading=false;
let requestNumber=0;

const SYSTEM_FOLDERS=[
 {id:"ALL_MAIL",name:"All Mail",icon:"✉"},
 {id:"INBOX",name:"Inbox",icon:"📥"},
 {id:"STARRED",name:"Starred",icon:"⭐"},
 {id:"SENT",name:"Sent",icon:"📤"},
 {id:"DRAFT",name:"Drafts",icon:"📝"},
 {id:"SPAM",name:"Spam",icon:"🚫"},
 {id:"TRASH",name:"Trash",icon:"🗑"}
];

const $=id=>document.getElementById(id);

function toast(message){
 $("toast").textContent=message;
 $("toast").style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>$("toast").style.display="none",3000);
}
function showStatus(message){$("loadStatus").textContent=message}
function showLogin(){
 $("loginForm").classList.remove("hidden");
 $("signupForm").classList.add("hidden");
 $("authStatus").textContent="";
}
function showSignup(){
 $("loginForm").classList.add("hidden");
 $("signupForm").classList.remove("hidden");
 $("authStatus").textContent="";
}
function formatDate(value){
 if(!value)return "";
 const d=new Date(value);
 return isNaN(d.getTime())?String(value):d.toLocaleString();
}
async function api(path,options={}){
 if(!currentUser)throw new Error("Please login first");
 const token=await currentUser.getIdToken();
 const response=await fetch(API_BASE+path,{
  ...options,
  headers:{
   ...(options.headers||{}),
   "Authorization":"Bearer "+token,
   ...(options.body?{"Content-Type":"application/json"}:{})
  }
 });
 let data={};
 try{data=await response.json()}catch(e){}
 if(!response.ok)throw new Error(data.message||data.error||"Server request failed ("+response.status+")");
 return data;
}

async function login(){
 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;
 if(!email||!password){$("authStatus").textContent="Enter email and password.";return}
 try{
  $("authStatus").textContent="Logging in...";
  await auth.signInWithEmailAndPassword(email,password);
 }catch(e){$("authStatus").textContent=e.message}
}
async function signup(){
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;
 if(!email||password.length<6){
  $("authStatus").textContent="Enter a valid email and password (at least 6 characters).";
  return;
 }
 try{
  $("authStatus").textContent="Creating account...";
  await auth.createUserWithEmailAndPassword(email,password);
 }catch(e){$("authStatus").textContent=e.message}
}
async function googleLogin(){
 try{
  const provider=new firebase.auth.GoogleAuthProvider();
  await auth.signInWithPopup(provider);
 }catch(e){$("authStatus").textContent=e.message}
}
async function logout(){await auth.signOut()}

auth.onAuthStateChanged(async user=>{
 currentUser=user;
 if(user){
  $("authPage").classList.add("hidden");
  $("app").classList.remove("hidden");
  showStatus("Restoring saved Gmail accounts...");
  await loadAccounts();
 }else{
  $("app").classList.add("hidden");
  $("authPage").classList.remove("hidden");
  accounts=[];messages=[];selectedAccount="all";selectedFolder="INBOX";
 }
});

async function loadAccounts(){
 try{
  const result=await api("/api/gmail/accounts");
  accounts=result.accounts||[];
  $("accountCount").textContent=accounts.length+" Gmail accounts";
  renderAccounts();
  if(!accounts.length){
   messages=[];renderMessages();
   showStatus("No Gmail connected. Connect your first Gmail.");
   return;
  }
  showStatus("Gmail accounts restored.");
  await loadMessages();
 }catch(e){
  showStatus(e.message);
  toast(e.message);
 }
}

function renderAccounts(){
 const container=$("accountList");
 container.innerHTML="";
 accounts.forEach(account=>{
  const item=document.createElement("div");
  item.className="account-item"+(selectedAccount===account.id?" active":"");
  item.textContent="✉ "+account.email;
  item.title=account.email;
  item.onclick=()=>{
   selectedAccount=account.id;
   selectedFolder="INBOX";
   customLabels=[];
   renderAccounts();
   loadMessages();
   $("sidebar").classList.remove("open");
  };
  container.appendChild(item);
 });
 $("allAccountsNav").classList.toggle("active",selectedAccount==="all");
 renderFolders();
}

function selectAllAccounts(){
 selectedAccount="all";
 selectedFolder="INBOX";
 customLabels=[];
 renderAccounts();
 loadMessages();
 $("sidebar").classList.remove("open");
}
function toggleSidebar(){$("sidebar").classList.toggle("open")}

function renderFolders(){
 const container=$("systemFolders");
 container.innerHTML="";
 SYSTEM_FOLDERS.forEach(folder=>{
  const item=document.createElement("div");
  item.className="nav"+(selectedFolder===folder.id?" active":"");
  item.textContent=folder.icon+" "+(folder.id==="INBOX"&&selectedAccount==="all"?"All Inbox":folder.name);
  item.onclick=()=>{
   selectedFolder=folder.id;
   renderFolders();
   loadMessages();
   $("sidebar").classList.remove("open");
  };
  container.appendChild(item);
 });
 if(selectedAccount!=="all")loadCustomLabels();
}

async function loadCustomLabels(){
 const accountId=selectedAccount;
 try{
  const result=await api("/api/gmail/labels?accountId="+encodeURIComponent(accountId));
  if(selectedAccount!==accountId)return;
  customLabels=(result.labels||[]).filter(label=>label.type==="user");
  const container=$("systemFolders");
  if(customLabels.length){
   const heading=document.createElement("div");
   heading.className="account-title";
   heading.textContent="Custom Labels";
   container.appendChild(heading);
   customLabels.forEach(label=>{
    const item=document.createElement("div");
    item.className="nav"+(selectedFolder===label.id?" active":"");
    item.textContent="🏷 "+label.name;
    item.onclick=()=>{
     selectedFolder=label.id;
     renderFolders();
     loadMessages();
    };
    container.appendChild(item);
   });
  }
 }catch(e){
  console.warn("Custom labels endpoint unavailable:",e.message);
 }
}

function getFolderName(id){
 if(id==="INBOX"&&selectedAccount==="all")return "All Inbox";
 const folder=SYSTEM_FOLDERS.find(f=>f.id===id);
 if(folder)return folder.name;
 const custom=customLabels.find(f=>f.id===id);
 return custom?custom.name:"Messages";
}

async function loadMessages(){
 if(loading)return;
 if(!accounts.length){messages=[];renderMessages();return}
 const myRequest=++requestNumber;
 loading=true;
 messages=[];
 renderMessages();
 $("pageTitle").textContent=getFolderName(selectedFolder);
 showStatus("Loading messages...");

 try{
  const selected=selectedAccount==="all"?accounts:accounts.filter(a=>a.id===selectedAccount);
  const results=await Promise.allSettled(selected.map(async account=>{
   const params=new URLSearchParams({
    accountId:account.id,
    labelId:selectedFolder,
    maxResults:"40"
   });
   const result=await api("/api/gmail/messages?"+params.toString());
   return (result.messages||[]).map(m=>({...m,accountId:account.id,email:account.email}));
  }));
  if(myRequest!==requestNumber)return;
  results.forEach(r=>{if(r.status==="fulfilled")messages.push(...r.value)});
  messages.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  const failed=results.filter(r=>r.status==="rejected").length;
  showStatus(messages.length+" messages loaded"+(failed?" · "+failed+" account(s) failed":""));
  renderMessages();
 }catch(e){
  if(myRequest===requestNumber){showStatus(e.message);toast(e.message)}
 }finally{
  if(myRequest===requestNumber)loading=false;
 }
}
function reloadMessages(){loadMessages()}
async function reloadEverything(){
 if(loading)return;
 await loadAccounts();
}

function renderMessages(){
 const container=$("messageList");
 const query=$("searchBox").value.toLowerCase().trim();
 const filtered=messages.filter(m=>{
  const text=[m.from,m.to,m.subject,m.snippet,m.email].join(" ").toLowerCase();
  return text.includes(query);
 });
 container.innerHTML="";
 if(!filtered.length){
  const empty=document.createElement("div");
  empty.className="empty";
  empty.textContent=query?"No matching messages found.":"No messages in this folder.";
  container.appendChild(empty);
  return;
 }
 filtered.forEach(message=>{
  const row=document.createElement("div");
  row.className="message"+(message.unread?" unread":"");
  const sender=document.createElement("div");
  sender.className="sender";
  sender.textContent=message.from||"(Unknown sender)";
  const content=document.createElement("div");
  content.className="message-content";
  const subject=document.createElement("div");
  subject.className="subject";
  subject.textContent=message.subject||"(No subject)";
  const snippet=document.createElement("div");
  snippet.className="snippet";
  snippet.textContent=message.snippet||"";
  const source=document.createElement("div");
  source.className="source";
  source.textContent=message.email||"";
  content.append(subject,snippet,source);
  const date=document.createElement("div");
  date.className="date";
  date.textContent=formatDate(message.date);
  row.append(sender,content,date);
  row.onclick=()=>openMessage(message);
  container.appendChild(row);
 });
}

function findOTP(text){
 const patterns=[
  /(?:otp|verification code|security code|one[- ]time code|passcode|confirmation code|your code is)[^\d]{0,35}(\d{4,8})/i,
  /(\d{4,8})[^\d]{0,25}(?:is your otp|is your verification code|is your security code)/i
 ];
 for(const pattern of patterns){
  const match=String(text||"").match(pattern);
  if(match)return match[1];
 }
 return "";
}
async function copyOTP(code){
 try{
  await navigator.clipboard.writeText(code);
  toast("OTP copied: "+code);
 }catch(e){
  const area=document.createElement("textarea");
  area.value=code;
  document.body.appendChild(area);
  area.select();
  try{document.execCommand("copy");toast("OTP copied: "+code)}
  catch(err){toast("Could not copy OTP")}
  area.remove();
 }
}

async function openMessage(message){
 $("reader").style.display="block";
 $("readSubject").textContent="Loading message...";
 $("readMeta").textContent="";
 $("readBody").textContent="";
 $("otpArea").innerHTML="";
 try{
  const params=new URLSearchParams({accountId:message.accountId,id:message.id});
  const result=await api("/api/gmail/message?"+params.toString());
  const mail=result.message||{};
  $("readSubject").textContent=mail.subject||"(No subject)";
  $("readMeta").textContent=
   "From: "+(mail.from||"")+
   "\nTo: "+(mail.to||"")+
   "\nDate: "+(mail.date||"")+
   "\nGmail: "+(message.email||"");
  const body=mail.body||mail.snippet||"";
  $("readBody").textContent=body;
  const otp=findOTP((mail.subject||"")+"\n"+body);
  if(otp){
   const box=document.createElement("div");
   box.className="otp-box";
   const label=document.createElement("div");
   label.textContent="Possible verification code";
   const code=document.createElement("div");
   code.className="otp-code";
   code.textContent=otp;
   const button=document.createElement("button");
   button.className="copy-btn";
   button.textContent="Copy OTP";
   button.onclick=()=>copyOTP(otp);
   box.append(label,code,button);
   $("otpArea").appendChild(box);
  }
 }catch(e){
  $("readSubject").textContent="Could not open message";
  $("readBody").textContent=e.message;
 }
}
function closeReader(){$("reader").style.display="none"}

async function connectGmail(){
 if(accounts.length>=20){toast("Maximum 20 Gmail accounts allowed.");return}
 try{
  toast("Starting Gmail connection...");
  const result=await api("/api/gmail/connect",{method:"POST",body:JSON.stringify({})});
  if(!result.authUrl)throw new Error("Google authorization URL missing");
  window.location.href=result.authUrl;
 }catch(e){toast(e.message)}
}

window.addEventListener("load",()=>{
 const params=new URLSearchParams(location.search);
 if(params.get("gmail_connected")==="1"){
  toast("Gmail connected successfully!");
  history.replaceState({},document.title,location.pathname);
 }
 if(params.get("gmail_error")){
  toast("Gmail connection failed: "+params.get("gmail_error"));
  history.replaceState({},document.title,location.pathname);
 }
});
</script>
</body>
</html>
